name: RP2040 firmware build

on:
  push:
    branches: [main, "fix/**"]
    paths:
      - "src/pico_refactored/**"
      - "src/arduino_nano_dual_mode/**"
      - "src/shared/**"
      - "tests/**"
      - "docs/firmware/actuator-safety.md"
      - ".github/workflows/firmware-build.yml"
  pull_request:
    paths:
      - "src/pico_refactored/**"
      - "src/arduino_nano_dual_mode/**"
      - "src/shared/**"
      - "tests/**"
      - "docs/firmware/actuator-safety.md"
      - ".github/workflows/firmware-build.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pico-firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Arduino CLI
        uses: arduino/setup-arduino-cli@81d310742121c928ea9c8bbd407b4217b432ae02 # v2.0.0

      - name: Configure Raspberry Pi Pico core
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls https://github.com/earlephilhower/arduino-pico/releases/download/global/package_rp2040_index.json
          arduino-cli core update-index
          arduino-cli core install rp2040:rp2040@6.3.2

      - name: Install firmware libraries
        run: |
          arduino-cli lib update-index
          arduino-cli lib install "Ethernet"
          arduino-cli lib install "DHT sensor library"
          arduino-cli lib install "Adafruit SGP41"
          arduino-cli lib install "Sensirion Gas Index Algorithm"

      - name: Prepare Arduino sketch directory
        run: |
          mkdir -p .ci/pico-build
          cp src/pico_refactored/apiaryguard_pico.ino .ci/pico-build/pico-build.ino
          cp -R src/pico_refactored/include .ci/pico-build/include
          cp -R src/pico_refactored/src .ci/pico-build/src

      - name: Run host-side safe-mode policy tests
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror tests/safe_mode_policy_test.cpp -o /tmp/safe_mode_policy_test
          /tmp/safe_mode_policy_test

      - name: Run embedded command authentication reference tests
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror src/rpi_tui/tests/test_effector_auth.cpp -o /tmp/test_effector_auth
          /tmp/test_effector_auth

      - name: Compile Raspberry Pi Pico firmware
        run: |
          arduino-cli compile \
            --fqbn rp2040:rp2040:rpipico \
            --warnings all \
            --build-property compiler.cpp.extra_flags="-I${GITHUB_WORKSPACE}/.ci/pico-build/include" \
            .ci/pico-build

  arduino-nano-firmware:
    name: Arduino Nano ATmega328P firmware
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Arduino CLI
        uses: arduino/setup-arduino-cli@81d310742121c928ea9c8bbd407b4217b432ae02 # v2.0.0

      - name: Install AVR core and Nano dependencies
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:avr
          arduino-cli lib update-index
          arduino-cli lib install "UIPEthernet"
          arduino-cli lib install "DHT sensor library"
          arduino-cli lib install "Adafruit Unified Sensor"
          arduino-cli lib install "ArduinoJson"

      - name: Verify Nano HTTP actuator fail-closed behavior
        run: python3 src/arduino_nano_dual_mode/tests/test_http_actuator_guard.py

      - name: Compile Arduino Nano firmware
        run: |
          arduino-cli compile \
            --fqbn arduino:avr:nano \
            --warnings all \
            src/arduino_nano_dual_mode
