name: PHP API syntax

on:
  push:
    branches: [main, "fix/**"]
    paths:
      - "src/webui/**"
      - ".github/workflows/php-lint.yml"
  pull_request:
    paths:
      - "src/webui/**"
      - ".github/workflows/php-lint.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
      - name: Lint API entrypoint
        run: php -l src/webui/api.php
