name: Android build and tests

on:
  pull_request:
    paths:
      - "android_app/**"
      - ".github/workflows/android-build.yml"
  push:
    branches:
      - main
      - "fix/**"
    paths:
      - "android_app/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.2"

      - name: Run Android unit tests
        run: gradle -p android_app testDebugUnitTest

      - name: Build debug APK
        run: gradle -p android_app assembleDebug
