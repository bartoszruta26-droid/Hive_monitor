name: Native Qt Desktop build

on:
  pull_request:
    paths:
      - "src/desktop_gui/**"
      - ".github/workflows/desktop-gui-build.yml"
  push:
    branches:
      - main
      - "feature/**"
    paths:
      - "src/desktop_gui/**"
      - ".github/workflows/desktop-gui-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Qt 6 Linux x64
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Qt 6 development packages
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ qt6-base-dev qt6-webengine-dev qt6-webengine-dev-tools
      - name: Configure
        run: cmake -S src/desktop_gui -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel
      - name: Upload Linux executable
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: HiveMonitorDesktop-linux-x64
          path: build/HiveMonitorDesktop
          if-no-files-found: error

  windows:
    name: Qt 6 Windows Server ${{ matrix.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            version: "2022"
          - os: windows-2025
            version: "2025"
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Qt installer
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check aqtinstall==3.1.18
          aqt install-qt windows desktop 6.8.3 win64_msvc2022_64 -O C:\Qt -m qtwebengine
          "CMAKE_PREFIX_PATH=C:\Qt\6.8.3\msvc2022_64" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Configure
        run: cmake -S src/desktop_gui -B build -A x64 -DCMAKE_PREFIX_PATH="$env:CMAKE_PREFIX_PATH"
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Deploy Qt runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force deploy | Out-Null
          & "$env:CMAKE_PREFIX_PATH\bin\windeployqt.exe" --release --dir deploy build\Release\HiveMonitorDesktop.exe
      - name: Upload Windows package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: HiveMonitorDesktop-windows-server-${{ matrix.version }}-x64
          path: deploy/**
          if-no-files-found: error
