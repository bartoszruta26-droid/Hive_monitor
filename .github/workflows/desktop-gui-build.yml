name: Desktop GUI build

on:
  pull_request:
    paths:
      - "src/desktop_gui/**"
      - ".github/workflows/desktop-gui-build.yml"
  push:
    branches:
      - main
      - "feature/**"
    paths:
      - "src/desktop_gui/**"
      - ".github/workflows/desktop-gui-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    name: Desktop package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            artifact: linux-x64
          - os: windows-2022
            artifact: windows-server-2022-x64
          - os: windows-2025
            artifact: windows-server-2025-x64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r src/desktop_gui/requirements.txt
      - name: Check Python syntax
        run: python -m compileall -q src/desktop_gui
      - name: Build desktop executable
        working-directory: src/desktop_gui
        run: pyinstaller --noconfirm --clean --windowed --name HiveMonitorDesktop --collect-all PySide6 --collect-all shiboken6 desktop_gui.py
      - name: Upload desktop package
        uses: actions/upload-artifact@ea0bdf5e3a137c1e3d2c5b5f3a8e8f5f6f0a9a3b # v4
        with:
          name: HiveMonitorDesktop-${{ matrix.artifact }}
          path: src/desktop_gui/dist/HiveMonitorDesktop*
          if-no-files-found: error
